[flake8]
max-line-length = 79
extend-ignore = W503, E203
exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .venv,
    venv,
    build,
    dist

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True

# pytest optionally imports numpy under TYPE_CHECKING (for
# pytest.approx). numpy is not a project dependency; skip following
# into it so an incompatible third-party stub can't break `make lint`.
[mypy-numpy]
follow_imports = skip
ignore_errors = True

[mypy-numpy.*]
follow_imports = skip
ignore_errors = True
